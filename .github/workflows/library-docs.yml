# Documentation deployment workflow
name: Build and Deploy Library Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==80.10.2" "online-judge-verify-helper==5.6.0" "online-judge-tools==11.5.1"
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y doxygen
          git init /tmp/ac-library
          git -C /tmp/ac-library remote add origin https://github.com/atcoder/ac-library.git
          git -C /tmp/ac-library fetch --depth 1 origin 864245a00b00dd008d1abfdc239618fdb7d139da
          git -C /tmp/ac-library checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ac-library rev-parse HEAD)" = 864245a00b00dd008d1abfdc239618fdb7d139da
          sudo cp -r /tmp/ac-library/atcoder /usr/local/include/

      - name: Restore verification cache
        id: verification-cache
        uses: actions/cache@v4
        with:
          path: .verify-helper/timestamps.remote.json
          key: verification-remote-v1-${{ runner.os }}-${{ hashFiles('library/**', 'verify/**', '.verify-helper/config.toml', '.github/workflows/library-docs.yml') }}

      - name: Test headers and submission bundling
        run: python -m unittest discover -s .verify-helper/tests -v

      - name: Verify libraries
        if: steps.verification-cache.outputs.cache-hit != 'true'
        run: oj-verify all

      - name: Generate documentation
        run: oj-verify docs

      - name: Build site
        working-directory: .verify-helper/markdown
        run: |
          bundle config set path .vendor/bundle
          bundle install
          bundle exec jekyll build --destination ../../_site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
