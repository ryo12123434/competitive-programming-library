name: Build and Deploy Library Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install online-judge-verify-helper
          sudo apt-get update
          sudo apt-get install -y doxygen
          git clone --depth 1 https://github.com/atcoder/ac-library.git /tmp/ac-library
          sudo cp -r /tmp/ac-library/atcoder /usr/local/include/

      - name: Generate documentation
        run: env -u GITHUB_ACTION -u GITHUB_TOKEN oj-verify docs

      - name: Build site
        working-directory: .verify-helper/markdown
        run: |
          bundle config set path .vendor/bundle
          bundle install
          bundle exec jekyll build --destination ../../_site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
